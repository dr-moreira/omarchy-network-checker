[package]
name = "network_checker"
version = "1.0.0"
edition = "2024"
description = "Ping and port checker for home-lab servers"
license = "MIT"
repository = "https://github.com/dr-moreira/omarchy-network-checker"

[dependencies]
clap = { version = "4.5.42", features = ["derive"] }
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_derive = "1.0.219"
serde_json = "1.0"
toml = "0.9.4"
notify-rust = "4.11"
reqwest = { version = "0.12", features = ["json", "blocking"] }
chrono = "0.4"
dirs = "5.0"
